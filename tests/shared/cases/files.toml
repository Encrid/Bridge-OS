files = { "{case}/d/f" = "", "{case}/d/s/g" = "" }
claims = { matches = ["remove: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "os_path_remove is refused when the memory of the path of an entry fails"
