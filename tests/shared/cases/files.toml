[[case]]
name = "os_path_entry gives -1 for a name that Windows refuses, and 0 on Linux and macOS"
run = ["{out}/files{exe}", "{case}", "entry-of", "{case}/a<b"]
files = { "{case}/e" = "" }
claims = { line = ["entry-of: {invalid_entry}"] }
false = { run = ["{out}/files{exe}", "{case}", "entry-of", "{case}/e"] }

[[case]]
name = "os_file_write gives -1 for a file that is read-only"
run = ["{out}/files{exe}", "{case}", "locked"]
files = { "{case}/f" = "old" }
claims = { line = ["locked: -1"] }
false = { run = ["{out}/files{exe}", "{case}", "replace", "new"] }

[[case]]
name = "os_folder_make gives -1 when a folder above it is a file"
run = ["{out}/files{exe}", "{case}", "make", "a/k/x"]
files = { "{case}/a/k" = "" }
claims = { line = ["make: -1 0"] }
false = { run = ["{out}/files{exe}", "{case}", "make", "a/x/y"] }

[[case]]
name = "os_path_move gives -1 when the folder of the path to is not there"
run = ["{out}/files{exe}", "{case}", "move-args", "{case}/d", "{case}/d/k/x"]
files = { "{case}/d/k" = "" }
claims = { line = ["move-args: -1"] }
false = { run = ["{out}/files{exe}", "{case}", "move-args", "{case}/d", "{case}/b"] }

[[case]]
name = "os_path_move gives -1 when the folder of the path from is not there"
