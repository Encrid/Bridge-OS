files = { "{case}/e" = "" }
claims = { line = ["remove-of: -1"] }
false = { run = ["{out}/files{exe}", "{case}", "remove-of", "{case}/none"] }

[[case]]
name = "a path of only separators past the path limit names the root folder"
run = ["{out}/files{exe}", "{case}", "entry-of", ""]
files = { "{case}/e" = "" }
claims = { line = ["entry-of: {slash_entry}"] }
false = { run = ["{out}/files{exe}", "{case}", "entry-of", "{case}/e"] }

[[case]]
name = "os_file_write gives -1 for a file in a read-only folder"
run = ["{out}/files{exe}", "{case}", "locked-folder"]
claims = { line = ["locked-write: {locked_write}"] }
false = { run = ["{out}/files{exe}", "{case}", "replace", "new"] }

[[case]]
name = "os_folder_make gives -1 in a read-only folder"
run = ["{out}/files{exe}", "{case}", "locked-folder"]
claims = { line = ["locked-make: {locked_make}"] }
false = { run = ["{out}/files{exe}", "{case}", "make", "a/b"] }

[[case]]
name = "os_path_remove gives -1 for a folder in a read-only folder"
run = ["{out}/files{exe}", "{case}", "locked-folder"]
claims = { line = ["locked-remove: {locked_remove}"] }
false = { run = ["{out}/files{exe}", "{case}", "remove"] }

[[case]]
name = "os_folder_make gives -1 for a file that took the place of the folder"
run = ["{out}/files{exe}", "{case}", "make-file"]
claims = { line = ["make-file: -1"] }
false = { run = ["{out}/files{exe}", "{case}", "make", "a/b"] }

[[case]]
name = "why the path of only separators gives its result"
run = ["{out}/files{exe}", "{case}", "entry-why", ""]
files = { "{case}/e" = "" }
claims = { matches = ["entry-why: 3, 0, 5000, 4096, 1"] }
false = { run = ["{out}/files{exe}", "{case}", "entry-why", "{case}/e"] }
