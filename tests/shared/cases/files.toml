files = { "{case}/e" = "" }
claims = { line = ["entry-of: -1"] }
false = { run = ["{out}/files{exe}", "{case}", "entry-of", "{case}/e"] }

[[case]]
name = "os_path_remove gives -1 for a last name past the name limit of the system"
