fail = { malloc = 1, GetFileAttributesW = 1, SetFileAttributesW = 1, DeleteFileW = 1, RemoveDirectoryW = 1, FindFirstFileExW = 1, fstatat = 1, unlinkat = 1, fchmodat = 1 }
files = { "{case}/d/f" = "", "{case}/d/s/g" = "" }
claims = { matches = ["remove: [1-9] refused, then made"] }
false = { fail = {} }

[[case]]
name = "os_path_remove is refused when the memory of a search or the attributes of an entry fail"
