[[artifact]]
name = "os"
kind = "archive"
sources = ["src/{system}/*.c"]
include = ["include"]
flags = ["{quiet}", "{system_defines}"]

[[artifact]]
name = "leaks.toml"
kind = "file"
sources = [".toolchain/config/leaks.toml"]

[[artifact]]
name = "fixture"
kind = "library"
test = true
folder = "built"
path = true
sources = ["tests/fixture.c"]

[[artifact]]
name = "fixture_two"
kind = "library"
test = true
folder = "built"
path = true
sources = ["tests/fixture_two.c"]

[[artifact]]
name = "os"
kind = "program"
test = true
sources = ["tests/os_test.c", "src/{system}/*.c"]
include = ["include"]
defines = ["{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "clock"
kind = "program"
test = true
sources = ["tests/clock_test.c", "src/{system}/*.c"]
include = ["include"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "wait"
kind = "program"
test = true
sources = ["tests/wait_test.c", "src/{system}/*.c"]
include = ["include"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "stack"
kind = "program"
test = true
sources = ["tests/stack_test.c", "src/{system}/*.c"]
include = ["include"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "pins"
kind = "program"
test = true
sources = ["tests/pins_test.c", "src/{system}/*.c"]
include = ["include"]
defines = ["{paths}"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "signal"
kind = "program"
test = true
sources = ["tests/signal_test.c", "src/{system}/*.c"]
include = ["include"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]

[[artifact]]
name = "counted_os"
kind = "archive"
test = true
sources = ["src/{system}/*.c"]
include = ["include"]
defines = ["malloc=counted_malloc", "calloc=counted_calloc", "realloc=counted_realloc", "free=counted_free", "{counted_system}"]
flags = ["{quiet}", "{system_defines}"]

[[artifact]]
name = "counted"
kind = "program"
test = true
sources = ["tests/counted/*.c"]
include = ["include", "tests/counted"]
defines = ["COUNTED"]
link = ["{out}/counted_os.a"]
flags = ["{quiet}", "{system_defines}", "{system_libraries}"]
